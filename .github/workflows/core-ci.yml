name: Drumator Windows Core and VST3 Integration
on:
  push:
    branches: [develop/v1.0.0]
    paths:
      - 'src/core/**'
      - 'src/vst3/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact Steinberg SDK 3.8.1
        shell: pwsh
        run: |
          git clone --recursive --branch v3.8.1_build_84 --depth 1 https://github.com/steinbergmedia/vst3sdk.git sdk
          $actual = (git -C sdk rev-parse HEAD).Trim()
          if ($actual -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') {
            throw "Unexpected SDK checkout: $actual"
          }
          $status = git -C sdk submodule status --recursive
          $status | Write-Output
          if (@($status | Where-Object { $_ -match '^[-+U]' }).Count -gt 0) {
            throw "SDK has missing or modified submodules"
          }
      - name: Configure Windows x64 VST3 and standalone QA
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DDRUMATOR_BUILD_VST3=ON -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/sdk"
      - name: Build tests and Drumator VST3
        run: cmake --build build --config Release --target drumator_core_tests drumator_voice_tests Drumator --parallel 2
      - name: Run deterministic regressions
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect test instrument artifact
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path build -Filter 'Drumator.vst3' -Recurse)
          if ($found.Count -ne 1) {
            throw "Expected exactly one Drumator.vst3 bundle; found $($found.Count)"
          }
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item -Path $found[0].FullName -Destination 'artifact/Drumator.vst3' -Recurse -Force
          Get-ChildItem -Path artifact -Recurse | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Drumator-M03-VST3-UNTESTED
          path: artifact/Drumator.vst3
          if-no-files-found: error
