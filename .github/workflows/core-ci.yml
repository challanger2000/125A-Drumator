name: Drumator Windows Core and VST3 Integration
on:
  push:
    branches: [develop/v1.0.0]
    paths:
      - 'src/core/**'
      - 'src/vst3/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact Steinberg SDK 3.8.1
        shell: pwsh
        run: |
          git clone --recursive --branch v3.8.1_build_84 --depth 1 https://github.com/steinbergmedia/vst3sdk.git sdk
          $actual = (git -C sdk rev-parse HEAD).Trim()
          if ($actual -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') {
            throw "Unexpected SDK checkout: $actual"
          }
          $status = git -C sdk submodule status --recursive
          $status | Write-Output
          if (@($status | Where-Object { $_ -match '^[-+U]' }).Count -gt 0) {
            throw "SDK has missing or modified submodules"
          }
      - name: Configure Windows x64 VST3 and standalone QA
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DDRUMATOR_BUILD_VST3=ON -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/sdk"
      - name: Build tests and Drumator VST3
        run: cmake --build build --config Release --target drumator_test_suite drumator_editor_smoke drumator_audio_host_smoke Drumator validator moduleinfotool --parallel 2
      - name: Run deterministic regressions
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Assemble standard Windows VST3 bundle and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @(Get-ChildItem -Path build/VST3 -Filter 'Drumator.vst3' -File -Recurse)
          if ($found.Count -ne 1) {
            throw "Expected exactly one compiled Windows VST3 binary; found $($found.Count)"
          }
          $bundle = Join-Path $PWD 'artifact/125A Drumator.vst3'
          $binaryDirectory = Join-Path $bundle 'Contents/x86_64-win'
          $resourceDirectory = Join-Path $bundle 'Contents/Resources'
          New-Item -ItemType Directory -Path $binaryDirectory,$resourceDirectory -Force | Out-Null
          Copy-Item $found[0].FullName -Destination (Join-Path $binaryDirectory '125A Drumator.vst3')
          Copy-Item 'resource/Drumator.uidesc' -Destination (Join-Path $resourceDirectory 'Drumator.uidesc')
          $moduleInfo = Join-Path $resourceDirectory 'moduleinfo.json'
          & './build/bin/Release/moduleinfotool.exe' -create -version 0.1.0 -path $bundle -output $moduleInfo
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $moduleInfo)) {
            throw "Official Steinberg moduleinfotool creation failed"
          }
          # The SDK serializer emits trailing commas. Normalize to strict JSON
          # without changing class IDs or other generated metadata.
          $rawInfo = [System.IO.File]::ReadAllText($moduleInfo)
          $normalizedInfo = [regex]::Replace($rawInfo, ',(?=\s*[}\]])', '')
          $parsedInfo = $normalizedInfo | ConvertFrom-Json
          if ($parsedInfo.Classes[0].Name -ne '125A Drumator') {
            throw 'VST3 factory name is not 125A Drumator'
          }
          [System.IO.File]::WriteAllText($moduleInfo, $normalizedInfo, [System.Text.UTF8Encoding]::new($false))
          & './build/bin/Release/moduleinfotool.exe' -validate -path $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Official Steinberg moduleinfotool validation failed' }
          & './build/bin/Release/validator.exe' $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Steinberg VST3 Validator failed' }
          $bundleFiles = @(Get-ChildItem $bundle -File -Recurse)
          if (@($bundleFiles | Where-Object { $_.Length -eq 0 }).Count -gt 0) {
            throw 'Bundle contains zero-length files'
          }
          # Assert the exact complete, conventionally named installable tree.
          $artifactRoot = Join-Path $PWD 'artifact'
          $topLevel = @(Get-ChildItem $artifactRoot)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -cne '125A Drumator.vst3' -or -not $topLevel[0].PSIsContainer) {
            throw 'Wrong VST3 outer folder name or unexpected artifact root content'
          }
          $expected = @(
            '125A Drumator.vst3/Contents/x86_64-win/125A Drumator.vst3',
            '125A Drumator.vst3/Contents/Resources/Drumator.uidesc',
            '125A Drumator.vst3/Contents/Resources/moduleinfo.json'
          ) | Sort-Object
          $actual = @($bundleFiles | ForEach-Object {
            [System.IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\','/')
          }) | Sort-Object
          if (@(Compare-Object $expected $actual).Count -ne 0) {
            throw "Wrong VST3 packaging: actual=$($actual -join ', ')"
          }
          # An installable VST3 can pass Validator with an editor of 0x0.
          # Load the actual packaged DLL, create its editor and require 1100x600.
          $smoke = @(Get-ChildItem -Path build -Filter 'drumator_editor_smoke.exe' -File -Recurse)
          if ($smoke.Count -ne 1) {
            throw "Expected one editor smoke test executable; found $($smoke.Count)"
          }
          & $smoke[0].FullName (Join-Path $binaryDirectory '125A Drumator.vst3')
          if ($LASTEXITCODE -ne 0) {
            throw 'Actual packaged VST3 editor geometry smoke test FAILED'
          }
          # Full VST3 host simulation: actual MIDI, WAV message and audio.
          $audioSmoke = @(Get-ChildItem -Path build -Filter 'drumator_audio_host_smoke.exe' -File -Recurse)
          if ($audioSmoke.Count -ne 1) {
            throw 'Packaged audio smoke executable missing or ambiguous'
          }
          & $audioSmoke[0].FullName (Join-Path $binaryDirectory '125A Drumator.vst3')
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged VST3 WAV/MIDI/audio host simulation FAILED'
          }
          $bundleFiles | Select-Object FullName,Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: 125A-Drumator-M10-Embedded-Kit-Recall-QA
          # Upload the artifact ROOT, not the .vst3 directory itself: 
          # upload-artifact strips the supplied root from stored paths.
          path: artifact/
          if-no-files-found: error
